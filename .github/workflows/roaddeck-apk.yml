name: RoadDeck native split Android 10

on:
  push:
    branches: [roaddeck-split-screen]
    paths:
      - 'roaddeck/**'
      - '.github/workflows/roaddeck-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roaddeck-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-android10:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native APKs and unit tests
        working-directory: roaddeck
        run: gradle -ProaddeckFixtures=true :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Legacy WebView and compact settings checks
        working-directory: roaddeck
        run: node tests/test_split_ui.cjs
      - name: Preserve unsigned release for private signing
        uses: actions/upload-artifact@v4
        with:
          name: roaddeck-split-unsigned
          path: roaddeck/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native split on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_c
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash roaddeck/tools/run_emulator_test.sh
      - name: Keep Android 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roaddeck-android10-evidence
          path: |
            roaddeck/ci-evidence
            roaddeck/app/build/reports/tests
            roaddeck/app/build/test-results
          if-no-files-found: warn
          retention-days: 3
