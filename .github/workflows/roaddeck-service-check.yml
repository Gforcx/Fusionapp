name: RoadDeck 0.5.4 startup and system bars verification

on:
  push:
    branches: [roaddeck-service-check]
    paths-ignore:
      - roaddeck/docs/**
      - roaddeck/README.md
      - roaddeck/BUILD_VERIFIE.json
      - roaddeck/SHA256SUMS.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roaddeck-service-check
  cancel-in-progress: true

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: pixel_c
          - api: 36
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native APKs and unit tests
        working-directory: roaddeck
        run: gradle -ProaddeckFixtures=true :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Check legacy UI and diagnostics
        working-directory: roaddeck
        run: |
          node tests/test_split_ui.cjs
          python3 tools/test_check_binding.py
      - name: Preserve unsigned release for private signing
        if: matrix.api == 29
        uses: actions/upload-artifact@v4
        with:
          name: roaddeck-service-release-unsigned
          path: roaddeck/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 5
      - name: Size emulator from available runner memory
        id: emulator_memory
        working-directory: roaddeck
        env:
          ROADDECK_API: ${{ matrix.api }}
        run: |
          python3 - <<'PYMEM'
          import json, os
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          available_mib = int(mem['MemAvailable'].strip().split()[0]) // 1024
          api = int(os.environ['ROADDECK_API'])
          ram_mib = 2048
          if api == 36:
              if available_mib >= 6144:
                  ram_mib = 4096
              elif available_mib >= 5120:
                  ram_mib = 3072
              else:
                  raise SystemExit('Insufficient host memory for the Android 16 cold-start check: ' + str(available_mib) + ' MiB available')
          record = {'api': api, 'host_available_mib': available_mib, 'guest_ram_mib': ram_mib,
                    'cold_start_preserved': True, 'anr_checks_preserved': True}
          Path('ci-evidence').mkdir(exist_ok=True)
          Path('ci-evidence/runner-memory.json').write_text(json.dumps(record, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ram=' + str(ram_mib) + 'M\n')
          print(json.dumps(record))
          PYMEM
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android windows and service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ steps.emulator_memory.outputs.ram }}
          heap-size: 512M
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash roaddeck/tools/run_service_verification.sh ${{ matrix.api }}
      - name: Preserve binding and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roaddeck-service-api${{ matrix.api }}
          path: |
            roaddeck/service-evidence
            roaddeck/ci-evidence
            roaddeck/app/build/reports/tests
            roaddeck/app/build/test-results
          if-no-files-found: warn
          retention-days: 5

