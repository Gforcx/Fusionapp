name: RoadDeck accessibility binding Android 16

on:
  push:
    branches: [roaddeck-service-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roaddeck-service-check
  cancel-in-progress: true

jobs:
  binding-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unchanged RoadDeck 0.5 source
        working-directory: roaddeck
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check real accessibility binding on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell wm size 720x1280
            adb shell wm density 240
            adb shell input keyevent 82
            adb install -r roaddeck/app/build/outputs/apk/debug/app-debug.apk
            python3 roaddeck/tools/check_binding.py --output roaddeck/service-evidence
      - name: Preserve binding and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roaddeck-service-api36
          path: roaddeck/service-evidence
          if-no-files-found: warn
          retention-days: 5
