name: RoadDeck offline build tools
on:
  push:
    paths: ['.github/workflows/roaddeck-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve Android and radio dependencies
        shell: bash
        run: |
          echo 'android.useAndroidX=true' > roaddeck/gradle.properties
          cat >> roaddeck/app/build.gradle.kts <<'EOF'
          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.6.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.6.1")
          }
          EOF
          cd roaddeck
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Package minimal offline environment
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/roaddeck-toolchain/sdk/platforms /tmp/roaddeck-toolchain/sdk/build-tools /tmp/roaddeck-toolchain/gradle-home/caches
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/roaddeck-toolchain/sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/roaddeck-toolchain/sdk/build-tools/
          if [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then cp -a "$ANDROID_HOME/build-tools/34.0.0" /tmp/roaddeck-toolchain/sdk/build-tools/; fi
          cp -a "$ANDROID_HOME/licenses" /tmp/roaddeck-toolchain/sdk/
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          cp -a "$(dirname "$(dirname "$GRADLE_BIN")")" /tmp/roaddeck-toolchain/gradle
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/roaddeck-toolchain/gradle-home/caches/
          find /tmp/roaddeck-toolchain -name '*.lock' -delete
          tar -C /tmp -czf /tmp/RoadDeck-toolchain.tar.gz roaddeck-toolchain
          sha256sum /tmp/RoadDeck-toolchain.tar.gz
          du -h /tmp/RoadDeck-toolchain.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: RoadDeck-offline-toolchain
          path: /tmp/RoadDeck-toolchain.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
