name: RoadDeck Shizuku dependencies
on:
  push:
    paths: ['.github/workflows/roaddeck-shizuku-deps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve native display bridge dependencies
        run: |
          echo 'android.useAndroidX=true' > roaddeck/gradle.properties
          cat >> roaddeck/app/build.gradle.kts <<'EOF'
          dependencies {
            implementation("dev.rikka.shizuku:api:13.1.5")
            implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cd roaddeck
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Package dependency cache
        run: |
          mkdir -p /tmp/roaddeck-shizuku/caches
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/roaddeck-shizuku/caches/
          find /tmp/roaddeck-shizuku -name '*.lock' -delete
          tar -C /tmp -czf /tmp/RoadDeck-shizuku-deps.tar.gz roaddeck-shizuku
      - uses: actions/upload-artifact@v4
        with:
          name: RoadDeck-shizuku-dependencies
          path: /tmp/RoadDeck-shizuku-deps.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
