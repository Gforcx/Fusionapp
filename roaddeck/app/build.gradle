plugins { id 'com.android.application' }
def developmentKey = rootProject.file('signing/roaddeck-dev.keystore')
android {
    namespace 'fr.roaddeck.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.roaddeck.launcher'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.5.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        development {
            storeFile developmentKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { if (developmentKey.exists()) signingConfig signingConfigs.development }
        release { minifyEnabled false; signingConfig developmentKey.exists() ? signingConfigs.development : null }
    }
    testOptions { animationsDisabled true }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
